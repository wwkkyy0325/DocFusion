[package]
name = "docfusion-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
calamine = "0.36.1"
comrak = "0.56.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
pdfium-bundled = { version = "0.2.0", features = ["bundled"] }
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
zip = "8.6.0"

[dev-dependencies]
serde_json = "1.0.151"

[features]
test-support = []
