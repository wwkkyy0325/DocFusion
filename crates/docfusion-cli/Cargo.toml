[package]
name = "docfusion-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
docfusion-core = { version = "0.1.0", path = "../docfusion-core" }
docfusion-store = { version = "0.1.0", path = "../docfusion-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = { version = "0.8.23", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = "3.27.0"
