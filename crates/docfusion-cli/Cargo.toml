[package]
name = "docfusion-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The command is what the product is called. The package name says which crate
# it is, which is a fact about the repository rather than about the tool, and a
# manual that tells somebody to run `docfusion-cli` has leaked that.
[[bin]]
name = "docfusion"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
docfusion-core = { version = "0.1.0", path = "../docfusion-core" }
docfusion-store = { version = "0.1.0", path = "../docfusion-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
