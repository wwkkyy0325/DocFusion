[package]
name = "docfusion-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
docfusion-core = { version = "0.1.0", path = "../docfusion-core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
rapidocr-core = "0.2.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
docfusion-core = { path = "../docfusion-core", features = ["test-support"] }
tempfile = "3.27.0"

[build-dependencies]
sha2 = "0.11.0"
