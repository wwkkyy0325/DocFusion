[package]
name = "docfusion-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Runs the models on the GPU through DirectML. On by default once it has been
# measured on real pages; a spike until then.
directml = ["ort/directml", "rapidocr-core/directml"]

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
docfusion-core = { version = "0.1.0", path = "../docfusion-core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
# The same ONNX Runtime `rapidocr-core` runs the recogniser on, and the same
# version, so that one copy of the native library is linked rather than two.
ort = "2.0.0-rc.13"
rapidocr-core = "0.2.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
toml = { version = "0.8.23", default-features = false, features = ["parse", "display"] }
toml_edit = "0.22"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
docfusion-core = { path = "../docfusion-core", features = ["test-support"] }
tempfile = "3.27.0"

[build-dependencies]
sha2 = "0.11.0"
