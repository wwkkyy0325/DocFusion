<!DOCTYPE html>
<!-- One language, and it is this one. `zh-Hans` and not `zh`: what the webview
     does with the tag is choose which of the machine's few dozen Han fonts to
     draw a character with, and the ones for the traditional set look wrong
     beside text this program wrote. -->
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocFusion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="brand">DocFusion</span>
      <nav class="tabs" role="tablist">
        <button
          id="tab-document"
          class="tab"
          role="tab"
          aria-selected="true"
          aria-controls="panel-document"
        >
          文档
        </button>
        <button
          id="tab-records"
          class="tab"
          role="tab"
          aria-selected="false"
          aria-controls="panel-records"
        >
          记录
        </button>
        <button
          id="tab-settings"
          class="tab"
          role="tab"
          aria-selected="false"
          aria-controls="panel-settings"
        >
          设置
        </button>
      </nav>
      <span class="spacer"></span>
      <!-- Drawn rather than typed: no icon font and no library, just two paths
           stroked in whatever colour the button is using. The one shown is the
           theme pressing it gives you, so a sun while the window is dark. -->
      <button id="theme" class="quiet" title="切换到亮色">
        <svg id="icon-sun" class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M7.4 7.4 5.6 5.6M16.6 7.4l1.8-1.8M16.6 16.6l1.8 1.8M7.4 16.6l-1.8 1.8"
          />
        </svg>
        <!-- The rim is a half circle from top to bottom; the bite back out of
             it is a shallower arc between the same two points, whose centre is
             off to the right. Both flags matter: the second arc is the near
             side of its circle, not the far one, and taking the far one draws
             almost a whole circle — which at sixteen pixels reads as a sun. -->
        <svg id="icon-moon" class="icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M12 3A9 9 0 0 0 12 21 10.6 10.6 0 0 1 12 3Z" />
        </svg>
      </button>
      <button id="add" class="primary">添加文档</button>
    </header>

    <p id="problem" class="banner" hidden></p>

    <main>
      <section id="panel-document" class="panel" role="tabpanel" aria-labelledby="tab-document">
        <div id="screen"></div>
        <footer id="status" hidden></footer>
      </section>

      <section
        id="panel-records"
        class="panel"
        role="tabpanel"
        aria-labelledby="tab-records"
        hidden
      >
        <!-- Above the list rather than beside it, because what it does is
             change what the list below it is: empty is everything in the
             archive, and anything typed is the answer to a question. One panel
             with two states, rather than two panels showing the same documents
             in two ways. -->
        <div class="search">
          <input
            id="search"
            type="search"
            autocomplete="off"
            spellcheck="false"
            aria-controls="records"
          />
        </div>

        <ul id="records"></ul>
      </section>

      <section
        id="panel-settings"
        class="panel"
        role="tabpanel"
        aria-labelledby="tab-settings"
        hidden
      >
        <form id="settings">
          <div class="title-row">
            <h2 id="set-title">模型</h2>
            <!-- Whether this is known to work, which is not the same as whether
                 it is saved, and is the question somebody setting it up
                 actually has. -->
            <span id="health" class="badge" data-state="untested"></span>
          </div>
          <p id="set-about" class="lead"></p>

          <!-- The master switch, and the reason it is a switch: before it
               existed, stopping the model reading documents meant emptying the
               endpoint, which threw away the address and the key with it. -->
          <div class="field">
            <label class="check">
              <input id="set-enabled" type="checkbox" />
              <span id="lbl-enabled">使用大模型</span>
            </label>
            <p id="set-enabled-hint" class="hint"></p>
          </div>

          <!-- Everything the switch is about. Disabled rather than hidden, so
               that what is switched off can still be read. -->
          <div id="model-fields">
          <div class="field">
            <label id="lbl-endpoint" for="set-endpoint">端点地址</label>
            <input
              id="set-endpoint"
              type="text"
              spellcheck="false"
              autocomplete="off"
              aria-describedby="set-endpoint-error"
              placeholder="例如 https://api.deepseek.com"
            />
            <p id="set-endpoint-error" class="error" hidden></p>
          </div>

          <div class="field">
            <label id="lbl-model" for="set-model">模型</label>
            <!-- One of the two shows, never both. Which one is `drawModelField`
                 in app.js: the list once the endpoint has said what it serves,
                 and the text field when there is nothing to choose from. -->
            <div class="with-affix">
              <input
                id="set-model"
                type="text"
                spellcheck="false"
                autocomplete="off"
                placeholder="例如 deepseek-flash"
              />
              <select id="set-model-choice" hidden></select>
              <span id="model-mark" class="mark" aria-hidden="true" hidden>
                <svg class="icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
              </span>
            </div>
            <p id="set-model-error" class="error" hidden></p>
            <p class="hint">
              <span id="set-model-hint">不知道填什么？</span>
              <button id="fetch-models" type="button" class="link">问端点</button>
            </p>
          </div>

          <div class="field">
            <label id="lbl-key" for="set-key">密钥</label>
            <div class="with-affix">
              <input id="set-key" type="password" spellcheck="false" autocomplete="new-password" />
              <!-- The eye says what pressing it gives you, like the theme and
                   the language. Which of the two means "hidden" is a
                   convention nobody agrees on, so the tooltip says the action
                   as well. -->
              <button
                id="reveal"
                type="button"
                class="icon-button"
                aria-pressed="false"
                title="显示密钥"
              >
                <svg id="icon-eye" class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.7-6.5 10-6.5S22 12 22 12s-3.7 6.5-10 6.5S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg id="icon-eye-off" class="icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
                  <path d="M2 12s3.7-6.5 10-6.5S22 12 22 12s-3.7 6.5-10 6.5S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                  <path d="M4 3.5 20 20.5" />
                </svg>
              </button>
            </div>
            <p id="set-hint" class="hint"></p>
          </div>

          <div class="field">
            <label class="check">
              <input id="set-reasoning" type="checkbox" />
              <span id="lbl-reasoning">让模型先想一遍再回答</span>
            </label>
            <p id="set-reasoning-hint" class="hint"></p>
          </div>
          </div><!-- /#model-fields -->

          <!-- The other half of "which model reads this": the set that runs in
               this process. Outside the switch above, and not greyed out by
               it — that switch is about a model at the other end of a network,
               and these are files on this disk with no address and no key.

               One card, because it is one set. What a page becomes — headings,
               tables and text rather than a run of lines — is decided by all of
               it at once, so a list underneath would be six things a person has
               to add up before they can answer the only question they came
               with, which is whether to press the button. -->
          <div class="field">
            <label id="lbl-local">本机模型</label>

            <div id="local-card" class="model">
              <div class="model-head">
                <span id="local-name" class="model-name"></span>
                <span id="local-size" class="model-size"></span>
              </div>
              <p id="local-hint" class="model-about"></p>

              <div class="bar" id="local-bar" hidden><span id="local-fill"></span></div>

              <!-- One button, and during a download none at all. There is no
                   Stop: a quarter of a gigabyte arrives in seconds to tens of
                   seconds, it resumes if it is interrupted anyway, and a
                   second control beside the first is a decision offered where
                   nobody has one to make. -->
              <div class="model-row">
                <span id="local-state" class="model-state"></span>
                <button id="get-local" type="button" class="small">下载</button>
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="save" type="submit" class="primary">保存</button>
            <button id="test" type="button">测试</button>
            <span id="set-note" class="hint"></span>
          </div>
        </form>
      </section>
    </main>

    <!-- The question a row's Delete button asks.

         A `dialog`, opened with `showModal`, so the browser owns the focus
         trap, the Escape key and the backdrop — the same argument the `select`
         in the settings tab is there for, and the same conclusion: this is the
         mature component for the job and it is the one that cannot be dead to
         a keyboard or a screen reader.

         Both ways out are here rather than on the row, because they are two
         different sentences. One takes a record out of the list and leaves the
         file; the other destroys it. A row that guessed between them would be
         a row that sometimes deleted a document. -->
    <dialog id="record-question">
      <h2 id="ask-title"></h2>
      <p id="ask-about" class="lead"></p>

      <dl class="ways">
        <dt id="ask-remove-label"></dt>
        <dd id="ask-remove-what"></dd>
        <dt id="ask-delete-label"></dt>
        <dd id="ask-delete-what"></dd>
      </dl>

      <p id="ask-source" class="hint"></p>

      <div class="actions">
        <button id="ask-cancel" type="button"></button>
        <button id="ask-remove" type="button"></button>
        <button id="ask-delete" type="button" class="danger filled"></button>
      </div>
    </dialog>

    <!-- The question an Export button asks: which of the formats.

         One button per format rather than a list of choices with a confirm
         under it, because the choice is the whole of the answer — the second
         step would be asking the same question again.

         Each button says what the format *keeps*, because that is what is
         being chosen between: not four file extensions, but a paragraph's
         emphasis and a table a spreadsheet can open. That is also why the
         formats on offer differ by what is being exported — a heading and a
         table do not have the same answer.

         A `dialog` for the same reasons as the one above. What it carries that
         the one above does not is what it is about: the backdrop covers the
         document, so after opening it a person can no longer see which block
         they pressed Export on. -->
    <dialog id="export-question">
      <h2 id="export-title"></h2>
      <p id="export-about" class="lead"></p>
      <div id="export-formats" class="formats"></div>
      <div class="actions">
        <button id="export-cancel" type="button" class="quiet"></button>
      </div>
    </dialog>

    <!-- The question the editor asks when it is closed with something in it
         that is not on disk.

         Three ways out rather than two, because there are three things a person
         wants at that moment and a button that guessed between them would
         sometimes throw away what somebody typed: keep editing, save, or throw
         it away deliberately. The destructive one is the quiet one, because it
         is the answer nobody means to give. -->
    <dialog id="unsaved-question">
      <h2 id="unsaved-title"></h2>
      <p id="unsaved-about" class="lead"></p>
      <div class="actions">
        <button id="unsaved-cancel" type="button" class="quiet"></button>
        <button id="unsaved-drop" type="button" class="danger"></button>
        <button id="unsaved-save" type="button" class="primary"></button>
      </div>
    </dialog>

    <!-- The question asked before a file that has been edited by hand is read
         again.

         Not before every add: adding a file that is already in the knowledge
         base and has not changed is a cache hit, which does not write the
         document at all, and an edit survives that. It does not survive the
         engines changing, which is when this appears. -->
    <dialog id="rerun-question">
      <h2 id="rerun-title"></h2>
      <p id="rerun-about" class="lead"></p>
      <div class="actions">
        <button id="rerun-cancel" type="button" class="quiet"></button>
        <button id="rerun-go" type="button" class="danger filled"></button>
      </div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
