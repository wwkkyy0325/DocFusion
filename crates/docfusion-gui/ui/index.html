<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocFusion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="brand">DocFusion</span>
      <nav class="tabs" role="tablist">
        <button
          id="tab-document"
          class="tab"
          role="tab"
          aria-selected="true"
          aria-controls="panel-document"
        >
          Document
        </button>
        <button
          id="tab-records"
          class="tab"
          role="tab"
          aria-selected="false"
          aria-controls="panel-records"
        >
          Records
        </button>
      </nav>
      <span class="spacer"></span>
      <!-- Both labels here are replaced at startup from the view's own
           language, and are English only so that the markup reads on its own. -->
      <button id="lang" class="quiet" title="用中文显示界面">中文</button>
      <button id="add" class="primary">Add a document</button>
    </header>

    <p id="problem" class="banner" hidden></p>

    <main>
      <section id="panel-document" class="panel" role="tabpanel" aria-labelledby="tab-document">
        <div id="screen"></div>
        <footer id="status" hidden></footer>
      </section>

      <section
        id="panel-records"
        class="panel"
        role="tabpanel"
        aria-labelledby="tab-records"
        hidden
      >
        <ul id="records"></ul>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
