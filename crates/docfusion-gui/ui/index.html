<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocFusion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="brand">DocFusion</span>
      <nav class="tabs" role="tablist">
        <button
          id="tab-document"
          class="tab"
          role="tab"
          aria-selected="true"
          aria-controls="panel-document"
        >
          Document
        </button>
        <button
          id="tab-records"
          class="tab"
          role="tab"
          aria-selected="false"
          aria-controls="panel-records"
        >
          Records
        </button>
        <button
          id="tab-settings"
          class="tab"
          role="tab"
          aria-selected="false"
          aria-controls="panel-settings"
        >
          Settings
        </button>
      </nav>
      <span class="spacer"></span>
      <!-- Drawn rather than typed: no icon font and no library, just two paths
           stroked in whatever colour the button is using. The one shown is the
           theme pressing it gives you, so a sun while the window is dark —
           the same rule the language button follows. -->
      <button id="theme" class="quiet" title="切换到亮色">
        <svg id="icon-sun" class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M7.4 7.4 5.6 5.6M16.6 7.4l1.8-1.8M16.6 16.6l1.8 1.8M7.4 16.6l-1.8 1.8"
          />
        </svg>
        <!-- The rim is a half circle from top to bottom; the bite back out of
             it is a shallower arc between the same two points, whose centre is
             off to the right. Both flags matter: the second arc is the near
             side of its circle, not the far one, and taking the far one draws
             almost a whole circle — which at sixteen pixels reads as a sun. -->
        <svg id="icon-moon" class="icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M12 3A9 9 0 0 0 12 21 10.6 10.6 0 0 1 12 3Z" />
        </svg>
      </button>
      <button id="lang" class="quiet" title="用中文显示界面">中文</button>
      <button id="add" class="primary">Add a document</button>
    </header>

    <p id="problem" class="banner" hidden></p>

    <main>
      <section id="panel-document" class="panel" role="tabpanel" aria-labelledby="tab-document">
        <div id="screen"></div>
        <footer id="status" hidden></footer>
      </section>

      <section
        id="panel-records"
        class="panel"
        role="tabpanel"
        aria-labelledby="tab-records"
        hidden
      >
        <ul id="records"></ul>
      </section>

      <section
        id="panel-settings"
        class="panel"
        role="tabpanel"
        aria-labelledby="tab-settings"
        hidden
      >
        <form id="settings">
          <div class="title-row">
            <h2 id="set-title">Model</h2>
            <!-- Whether this is known to work, which is not the same as whether
                 it is saved, and is the question somebody setting it up
                 actually has. -->
            <span id="health" class="badge" data-state="untested"></span>
          </div>
          <p id="set-about" class="lead"></p>

          <!-- The master switch, and the reason it is a switch: before it
               existed, stopping the model reading documents meant emptying the
               endpoint, which threw away the address and the key with it. -->
          <div class="field">
            <label class="check">
              <input id="set-enabled" type="checkbox" />
              <span id="lbl-enabled">Use a vision model</span>
            </label>
            <p id="set-enabled-hint" class="hint"></p>
          </div>

          <!-- Everything the switch is about. Disabled rather than hidden, so
               that what is switched off can still be read. -->
          <div id="model-fields">
          <div class="field">
            <label id="lbl-endpoint" for="set-endpoint">Endpoint</label>
            <input
              id="set-endpoint"
              type="text"
              spellcheck="false"
              autocomplete="off"
              aria-describedby="set-endpoint-error"
              placeholder="https://api.deepseek.com"
            />
            <p id="set-endpoint-error" class="error" hidden></p>
          </div>

          <div class="field">
            <label id="lbl-model" for="set-model">Model</label>
            <!-- One of the two shows, never both. Which one is `drawModelField`
                 in app.js: the list once the endpoint has said what it serves,
                 and the text field when there is nothing to choose from. -->
            <div class="with-affix">
              <input
                id="set-model"
                type="text"
                spellcheck="false"
                autocomplete="off"
                placeholder="deepseek-flash"
              />
              <select id="set-model-choice" hidden></select>
              <span id="model-mark" class="mark" aria-hidden="true" hidden>
                <svg class="icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
              </span>
            </div>
            <p id="set-model-error" class="error" hidden></p>
            <p class="hint">
              <span id="set-model-hint">Not sure what goes here?</span>
              <button id="fetch-models" type="button" class="link">Ask the endpoint</button>
            </p>
          </div>

          <div class="field">
            <label id="lbl-key" for="set-key">Key</label>
            <div class="with-affix">
              <input id="set-key" type="password" spellcheck="false" autocomplete="new-password" />
              <!-- The eye says what pressing it gives you, like the theme and
                   the language. Which of the two means "hidden" is a
                   convention nobody agrees on, so the tooltip says the action
                   as well. -->
              <button
                id="reveal"
                type="button"
                class="icon-button"
                aria-pressed="false"
                title="显示密钥"
              >
                <svg id="icon-eye" class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.7-6.5 10-6.5S22 12 22 12s-3.7 6.5-10 6.5S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg id="icon-eye-off" class="icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
                  <path d="M2 12s3.7-6.5 10-6.5S22 12 22 12s-3.7 6.5-10 6.5S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                  <path d="M4 3.5 20 20.5" />
                </svg>
              </button>
            </div>
            <p id="set-hint" class="hint"></p>
          </div>

          <div class="field">
            <label class="check">
              <input id="set-reasoning" type="checkbox" />
              <span id="lbl-reasoning">Let the model think first</span>
            </label>
            <p id="set-reasoning-hint" class="hint"></p>
          </div>
          </div><!-- /#model-fields -->

          <!-- The other half of "which model reads this": the set that runs in
               this process. Outside the switch above, and not greyed out by
               it — that switch is about a model at the other end of a network,
               and these are files on this disk with no address and no key.

               One card, because it is one set. What a page becomes — headings,
               tables and text rather than a run of lines — is decided by all of
               it at once, so a list underneath would be six things a person has
               to add up before they can answer the only question they came
               with, which is whether to press the button. -->
          <div class="field">
            <label id="lbl-local">Models on this machine</label>

            <div id="local-card" class="model">
              <div class="model-head">
                <span id="local-name" class="model-name"></span>
                <span id="local-size" class="model-size"></span>
              </div>
              <p id="local-hint" class="model-about"></p>

              <div class="bar" id="local-bar" hidden><span id="local-fill"></span></div>

              <div class="model-row">
                <span id="local-state" class="model-state"></span>
                <button id="get-local" type="button" class="small">Download</button>
                <button id="stop-local" type="button" class="small" hidden>Stop</button>
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="save" type="submit" class="primary">Save</button>
            <button id="test" type="button">Test</button>
            <span id="set-note" class="hint"></span>
          </div>
        </form>
      </section>
    </main>

    <!-- The question a row's Delete button asks.

         A `dialog`, opened with `showModal`, so the browser owns the focus
         trap, the Escape key and the backdrop — the same argument the `select`
         in the settings tab is there for, and the same conclusion: this is the
         mature component for the job and it is the one that cannot be dead to
         a keyboard or a screen reader.

         Both ways out are here rather than on the row, because they are two
         different sentences. One takes a record out of the list and leaves the
         file; the other destroys it. A row that guessed between them would be
         a row that sometimes deleted a document. -->
    <dialog id="record-question">
      <h2 id="ask-title"></h2>
      <p id="ask-about" class="lead"></p>

      <dl class="ways">
        <dt id="ask-remove-label"></dt>
        <dd id="ask-remove-what"></dd>
        <dt id="ask-delete-label"></dt>
        <dd id="ask-delete-what"></dd>
      </dl>

      <p id="ask-source" class="hint"></p>

      <div class="actions">
        <button id="ask-cancel" type="button"></button>
        <button id="ask-remove" type="button"></button>
        <button id="ask-delete" type="button" class="danger filled"></button>
      </div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
