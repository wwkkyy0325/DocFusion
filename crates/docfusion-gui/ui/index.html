<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocFusion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="brand">DocFusion</span>
      <span class="spacer"></span>
      <button id="add" class="primary">Add a document</button>
      <button id="records">Records</button>
    </header>

    <p id="problem" class="banner" hidden></p>

    <main id="screen"></main>

    <footer id="status" hidden></footer>

    <aside id="drawer" hidden>
      <div class="drawer-head">
        <span>Records</span>
        <button id="close-drawer" class="quiet">Close</button>
      </div>
      <ul id="records"></ul>
    </aside>

    <script type="module" src="app.js"></script>
  </body>
</html>
