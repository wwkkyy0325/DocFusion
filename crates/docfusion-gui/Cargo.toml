[package]
name = "docfusion-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop application for DocFusion"

[lib]
name = "docfusion_gui"
path = "src/lib.rs"

[[bin]]
name = "docfusion-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
docfusion-core = { version = "0.2.0", path = "../docfusion-core" }
docfusion-store = { version = "0.2.0", path = "../docfusion-store" }
base64 = "0.23.1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.1"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Tauri's own convention: a custom-protocol build embeds the frontend, a debug
# build can point at files on disk. Carried through so `cargo build` and
# `cargo tauri build` agree about which is which.
custom-protocol = ["tauri/custom-protocol"]
